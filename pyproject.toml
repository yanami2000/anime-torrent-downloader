[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torrent-dl"
version = "0.3.0"
description = "Headless RSS -> torrent -> download pipeline for anime (libtorrent)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "libtorrent>=2.0,<3.0",
]

[project.scripts]
torrent-dl = "torrentdl.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["torrentdl"]
